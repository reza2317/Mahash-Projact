    <path d="M100 45 C150 45 180 80 180 120 C180 160 150 190 120 190 C100 190 85 175 85 155 C85 140 95 130 110 130 C130 130 140 145 140 160 C140 120 115 85 85 85 C65 85 55 105 55 125" fill="none" stroke="#ffffff" stroke-width="14"/>
