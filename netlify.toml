[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback: Redirect all requests to index.html for React Router / SPA navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for fast performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
